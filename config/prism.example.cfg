-- prism.example.cfg - an annotated router config. Run prism-setup to write /home/prism.cfg
-- for your setup instead of copying this by hand.
-- A Lua table; "sides" is available. Every option is explained in docs/configuration.md.
return {
  -- Seconds between network scans, feeder steps and machine checks.
  interval = 5,
  feedInterval = 1,
  monitorInterval = 2,

  -- Alerts: a process is "stalled" when items are waiting but nothing has moved
  -- for stallAfter seconds; a monitored machine sitting idle with work waiting
  -- for idleAlert seconds also raises one.
  stallAfter = 60,
  idleAlert = 30,

  -- Filter slots per export bus: 1 with no Capacity Cards, 5 with one, 9 with two.
  slotsPerBus = 9,

  -- Address (or first few characters) of the subnet's me_controller / me_interface,
  -- and of the Database Upgrade (only needed for buses and feeders). nil = use the
  -- first one found. Run prism-setup.
  network  = nil,
  database = nil,

  -- Wireless status broadcasts + commands for the display computer. nil disables.
  modemPort = 4242,
  -- Optional shared secret the display computer must send with commands.
  token = nil,

  -- Report to LENS, the base-wide monitoring hub, on its own port and secret (not the ones above).
  -- false = off. See docs/configuration.md, "Reporting to LENS".
  lensPort  = false,
  lensNode  = "prism",
  lensToken = nil,

  -- Print every filter change.
  verbose = true,

  defaultPriority = 10,

  -- One entry per export bus. Same process on several buses = several machines.
  --   address: me_exportbus component address (prefix is fine)
  --   side:    which face of the cable block the bus sits on
  --   name:    optional label for logs and the display
  buses = {
    -- { address = "1a2b3c4d", side = sides.north, process = "wash",       name = "Washer 1" },
    -- { address = "1a2b3c4d", side = sides.south, process = "crush",      name = "Macerator 1" },
    -- { address = "5e6f7a8b", side = sides.up,    process = "centrifuge", name = "Centrifuge 1" },
  },

  -- GT Stocking Input Buses (ME) on multiblocks, each with an adapter touching it.
  -- They hold the top 16 items for their process and the multiblock pulls straight
  -- from the network, taking exactly what each recipe needs: no bus or feeder speed
  -- limit, and batch items are fine. One per multiblock.
  stockers = {
    -- { address = "7a8b9c0d", process = "ebf", name = "EBF 1" },
  },

  -- ME Interface BLOCKS (on the subnet, adapter touching each) that another network
  -- pulls from: its Import Bus faces the interface and takes whatever it stocks. Each
  -- holds a stack of each of its process's top 9 items. Batch-1 items only, like buses.
  interfaces = {
    -- { address = "2b3c4d5e", process = "export", name = "Main net" },
  },

  -- Feeders send exact multiples of an item's batch size, for recipes that need
  -- 2, 9, 36... of an input. Layout: ME Interface BLOCK (on the subnet, with an
  -- adapter touching it) -> Transposer -> machine. Sides are relative to the transposer.
  -- Export buses never get batch > 1 items; give the process a feeder or stocker instead.
  feeders = {
    -- { interface = "9c8d7e6f", transposer = "1f2e3d4c", interfaceSide = sides.west,
    --   machineSide = sides.east, process = "centrifuge", name = "Centrifuge 2" },
  },

  -- GT machines to watch (an adapter touching each one). Shown on the control
  -- screen with live progress, and used for stall/idle alerts. Run prism-setup.
  machines = {
    -- { address = "3a4b5c6d", process = "wash", name = "Washer 1" },
  },

  -- Per process. overflow = N: while more than N items wait for the process, items whose
  -- rule or override names a fallback are offered to that process too (both pull from the
  -- same stock). Items without one wait. On the control screen, ALWAYS SHARE on a process
  -- shares everything with a fallback.
  processes = {
    -- chembath = { overflow = 2000 },
  },

  -- Matched against the item's display name, top to bottom, first match wins.
  -- Once you edit rules on the control screen they're saved to
  -- prism-rules.cfg, which replaces this list (RESET on the screen goes back).
  -- Lua patterns: ^ = start, $ = end, .+ = anything. process = "ignore" means
  -- "leave it alone and don't report it as unassigned". batch = N sends the
  -- item in multiples of N (feeders and stockers only). fallback = "wash" shares the item
  -- with wash when its process overflows or always shares (see processes above).
  rules = {
    { pattern = "^Crushed .+ Ore$",           process = "wash",       priority = 10 },
    { pattern = "^Purified .+ Ore$",          process = "crush",      priority = 10 },
    { pattern = "^Centrifuged .+ Ore$",       process = "crush",      priority = 10 },
    { pattern = "^Impure Pile of .+ Dust$",   process = "centrifuge", priority = 10 },
    { pattern = "^Purified Pile of .+ Dust$", process = "centrifuge", priority = 10 },
    { pattern = "Ore$",                       process = "crush",      priority = 5  },
    -- { pattern = " Dust$",                  process = "ignore" },  -- finished dusts
  },

  -- Per-item overrides beat the rules. Key = "itemname:damage" (the router prints
  -- these for unassigned items). Overrides sent from the display computer are
  -- saved separately in prism-overrides.cfg and beat these.
  overrides = {
    -- ["gregtech:gt.metaitem.01:5086"] = { process = "chembath", priority = 50, fallback = "wash" },
    -- ["gregtech:gt.metaitem.01:2826"] = { process = "centrifuge", batch = 2 },
    -- ["minecraft:cobblestone:0"]      = { process = "ignore" },
  },
}
