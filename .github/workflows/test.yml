name: tests

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.3 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 liblua5.3-dev luarocks
          sudo luarocks --lua-version=5.3 install luacheck

      - name: Lint
        run: luacheck .

      - name: Test
        run: lua5.3 tests/run.lua
